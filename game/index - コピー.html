   	<body>
   	
   		<div id="gameover" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); justify-content:center; align-items:center; z-index:1000;">

   			<div style="background:#FFF7FB; border:3px solid #FFB6C1; border-radius:25px; padding:40px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.2);">
   				
   				<div style="font-size:45px;">💗</div>

   				</div>
   			
   		</div>
   		
   		<div id="clear" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); justify-content:center; align-items:center; z-index:1000;">
   		
   				<div style="background:#FFF7FB; border:3px solid #FFB6C1; border-radius:25px; padding:40px; text-align:center;">
   			
   				<div style="font-size:50px;">🎉</div>
   				
   				<div style="font-size:40px; color:#FF6B9A; font-weight:bold;">CLEAR!!</div>
   				
   				<div style="font-size:20px; color:#888888;">congratulations!</div>
   			
   			</div>
   			
   		</div>
   		
   		
		<h1 style="font-size:40px; text-align:center; color:#FF6B9A; font-family:'Arial'; text-shadow:2px 2px 5px #FFD6E7; margin-bottom:30px; "> 💗Pair Game💗</h1>
		
		<div style="display:flex; justify-content:center; align-items:flex-start; gap:30px;">
		
			<div style=" width:150px; text-align:center; flex-shrink:0; ">
		
				<div style="width:50px; height:560px; border:2px solid #FFB6C1; border-radius:20px; overflow:hidden; position:relative; margin:auto;">
				
					<div id="timer" style="position:absolute; bottom:0; width:100%; height:100%; background:#FFB6C1;"></div>
					
					<img id="bear" src="ryan.png" style="position:absolute; width:50px; left:50%; transform:translatex(-50%); top:-10px; z-index:10;"></div>
		
		<br>
		
		<button id="start"onclick="start()"style="font-size:20px; width:150px; height:50px; background:#FFB6C1; color:white; border:none; border-radius:30px;">START</button>
		
		</div>
		
		<div style= "width:490px;">
		
			<div class="box b00" onclick="clk(0,0);"></div>
			<div class="box b01" onclick="clk(0,1);"></div>
			<div class="box b02" onclick="clk(0,2);"></div>
			<div class="box b03" onclick="clk(0,3);"></div>
			<div class="box b04" onclick="clk(0,4);"></div>
			<div class="box b05" onclick="clk(0,5);"></div>

			<div class="box b07" onclick="clk(0,7);"></div>
			<div class="box b08" onclick="clk(1,0);"></div>

			<div class="box b10" onclick="clk(1,2);"></div>
			<div class="box b11" onclick="clk(1,3);"></div>
			<div class="box b12" onclick="clk(1,4);"></div>
			<div class="box b13" onclick="clk(1,5);"></div>
			<div class="box b14" onclick="clk(1,6);"></div>
			<div class="box b15" onclick="clk(1,7);"></div>
			<div class="box b16" onclick="clk(2,0);"></div>
			<div class="box b17" onclick="clk(2,1);"></div>
			<div class="box b18" onclick="clk(2,2);"></div>
			<div class="box b19" onclick="clk(2,3);"></div>
			<div class="box b20" onclick="clk(2,4);"></div>
			<div class="box b21" onclick="clk(2,5);"></div>
			<div class="box b22" onclick="clk(2,6);"></div>
			<div class="box b23" onclick="clk(2,7);"></div>
			<div class="box b24" onclick="clk(3,0);"></div>
			<div class="box b25" onclick="clk(3,1);"></div>
			<div class="box b26" onclick="clk(3,2);"></div>
			<div class="box b27" onclick="clk(3,3);"></div>
			<div class="box b28" onclick="clk(3,4);"></div>

			<div class="box b30" onclick="clk(3,6);"></div>

			<div class="box b32" onclick="clk(4,0);"></div>

			<div class="box b36" onclick="clk(4,4);"></div>
			<div class="box b37" onclick="clk(4,5);"></div>
			<div class="box b38" onclick="clk(4,6);"></div>
			<div class="box b39" onclick="clk(4,7);"></div>
			<div class="box b40" onclick="clk(5,0);"></div>
			<div class="box b41" onclick="clk(5,1);"></div>
			<div class="box b42" onclick="clk(5,2);"></div>
			<div class="box b43" onclick="clk(5,3);"></div>
			<div class="box b44" onclick="clk(5,4);"></div>
			<div class="box b45" onclick="clk(5,5);"></div>
			<div class="box b46" onclick="clk(5,6);"></div>
			<div class="box b47" onclick="clk(5,7);"></div>
			<div class="box b48" onclick="clk(6,0);"></div>
			<div class="box b49" onclick="clk(6,1);"></div>
			<div class="box b50" onclick="clk(6,2);"></div>
			<div class="box b51" onclick="clk(6,3);"></div>
			<div class="box b52" onclick="clk(6,4);"></div>
			<div class="box b53" onclick="clk(6,5);"></div>
			<div class="box b54" onclick="clk(6,6);"></div>
			<div class="box b55" onclick="clk(6,7);"></div>
			<div class="box b56" onclick="clk(7,0);"></div>
			<div class="box b57" onclick="clk(7,1);"></div>
			<div class="box b58" onclick="clk(7,2);"></div>
			<div class="box b59" onclick="clk(7,3);"></div>
			<div class="box b60" onclick="clk(7,4);"></div>
			<div class="box b61" onclick="clk(7,5);"></div>
			<div class="box b62" onclick="clk(7,6);"></div>
			<div class="box b63" onclick="clk(7,7);"></div>
			
			
				<div style="clear:both;"></div>
			
			</div>
			
			<div style="width:220px; flex-shrink:0;">
			
				<button id="shuffle"onclick="shuffle()"style="font-size:25px; width:220px; height:60px; background:#FFB6C1; color:white; border:none; border-radius:30px;">shuffle</button>
			
			</div>
		
		</div>
		
		<script>
		
			var card = [];
			var first = -1;
			var second = -1;
			var time = 90;
			var timer;
			clearcount = 0;
			
			
			function start(){
			
				clearInterval(timer);
				
				first = -1;
				second = -1;
				clearcount = 0;
				
				document.getElementById("gameover").style.display = "none";
				document.getElementById("clear").style.display = "none";
				
				time = 90;
				
				document.getElementById("timer").style.height = "100%";
				document.getElementById("bear").style.top = "-10px";
				
				card = [];
				
				for(var i=1; i<=32; i++){
					card.push(i);
					card.push(i);
					
					
			}
			
			shuffle();
			
			for(var i=0; i<64; i++){
				var id = "b" + ("0" + i).slice(-2);
				
				document.getElementsByClassName(id)[0].innerHTML = card[i];
				document.getElementsByClassName(id)[0].style.visibility = "visible"
				document.getElementsByClassName(id)[0].style.backgroundColor = "#FFFFFF";
				}
				
				timer = setInterval(count,1000);
			}
			
			function shuffle(){
						
				card.sort(function(){
					return Math.random() - 0.5;
				});
				
				for(var i=0; i<64; i++){
					var id = "b" + ("0"+ i).slice(-2);
					document.getElementsByClassName(id)[0].innerHTML = card[i];
					document.getElementsByClassName(id)[0].style.visibility = "visible"
				}
			}
			
			function clk(y,x){
			
				var no= y * 8 + x;
				
				if(first == -1){
				
					first = no;
					
					var id ="b" + ("0" + no).slice(-2);
					document.getElementsByClassName(id)[0].style.backgroundColor = "#FFD6E7";
					
			}else{
			
					second = no;
			
					var id1 ="b" +("0" + first).slice(-2);
					var id2 ="b" + ("0" + second).slice(-2);
					
					document.getElementsByClassName(id2)[0].style.backgroundColor = "#FFD6E7";
					
				
			if(card[first] == card[second]){
			
				clearcount++;
				
				if(clearcount == 32){
					clearInterval(timer);
					document.getElementById("clear").style.display = "flex";
					}
					
				
				var id1 ="b" + ("0" + first).slice(-2);
				var id2 ="b" + ("0" + second).slice(-2);
				
				document.getElementsByClassName(id1)[0].style.visibility = "hidden";
				document.getElementsByClassName(id2)[0].style.visibility = "hidden";
				
			}else{
			
				var id1 ="b" +("0" + first).slice(-2);
				var id2 ="b" + ("0" + second).slice(-2);
				
				document.getElementsByClassName(id1)[0].style.backgroundColor = "#FFFFFF";
				document.getElementsByClassName(id2)[0].style.backgroundColor = "#FFFFFF";
				
				}
				
				first = -1;
				second = -1;
				
			}
			
		 }
		 
		 	function count(){
			
				time--;
				
				var h = (time/90) * 100;
				
				document.getElementById("timer").style.height = h + "%";
				
				var top = (90 - time) / 90 * 500;
				document.getElementById("bear").style.top = top + "px";
				
				if(time <= 0){
					clearInterval(timer);
					
					document.getElementById("gameover").style.display = "flex";
					
					for(var i=0; i<64; i++){
						var id = "b" + ("0" + i).slice(-2);
						
						document.getElementsByClassName(id)[0].innerHTML = card[i];
						document.getElementsByClassName(id)[0].style.visibility = "visible";
												
						}
				document.getElementById("bear").style.top = "500px";
			}
		}
		
		// start();
		
		</script>

	</body>
</html>
